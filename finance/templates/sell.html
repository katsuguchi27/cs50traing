{% extends "layout.html" %}

{% block title %}
    Sell
{% endblock %}

{% block main %}
    <form action="/sell" method="post">
        <div class="mb-3"> <select class="form-select mx-auto w-auto" name="symbol" required>
            <option disabled selected value="">Select Symbol</option>
            {% for stock in symbols %} 
                <option value="{{ stock.symbol }}"> {{ stock.symbol }} </option>
            {% endfor %} 
        </select> 
        </div> <div class="mb-3">
            <input class="form-control mx-auto w-auto" name="shares" type="number" min="1" placeholder="Shares" required>
        </div>
        <button class="btn btn-primary" type="submit">Sell</button>
    </form>
    </form>
{% endblock %}
